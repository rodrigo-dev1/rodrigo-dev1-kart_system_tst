name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Permite rodar manualmente no GitHub

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar o repositório
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Instalar dependências Web
        run: npm install

      - name: 🏗️ Fazer o Build da aplicação (Vite)
        run: npm run build

      - name: ☕ Configurar Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: ⚙️ Configurar Capacitor e Criar Projeto Android
        run: |
          # Instala o Capacitor no fluxo do Actions
          npm install @capacitor/core @capacitor/android
          npm install -D @capacitor/cli
          
          # Inicializa apontando para a pasta dist gerada pelo Vite
          npx cap init "ERP Saude" "com.erpsaude.app" --web-dir dist --force
          
          # Adiciona a plataforma Android e sincroniza
          npx cap add android
          npx cap sync android

      - name: 🔑 Dar permissão ao Gradle
        run: chmod +x android/gradlew

      - name: 🤖 Compilar o APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug

      - name: 📤 Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: erp-saude-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk